<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ticket-radar 看板</title>
<style>
:root{
  --bg:#F5F6F7; --panel:#FFFFFF; --line:#E5E6EB; --line2:#F0F1F3;
  --text:#1F2329; --muted:#6B7280; --dim:#9CA3AF;
  --accent:#185FA5; --accent-bg:#E6F1FB;
  --ok:#0F6E56; --ok-bg:#E1F5EE;
  --warn:#BA7517; --alert:#A32D2D;
  --r:10px;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--text);
  font:14px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
}
a{color:var(--accent)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

header.top{
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:12px 18px; background:var(--panel); border-bottom:1px solid var(--line);
}
.brand{display:flex; align-items:center; gap:8px; font-weight:500; font-size:15px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok)}
.meta{color:var(--muted); font-size:12px; flex:1; min-width:180px}
.meta b{color:var(--text); font-weight:500}
.actions{display:flex; gap:8px; align-items:center}

.btn{
  border:1px solid var(--line); background:var(--panel); color:var(--text);
  padding:6px 13px; border-radius:8px; font-size:13px; cursor:pointer;
}
.btn:hover{border-color:#C9CDD4}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
.btn.primary:hover{background:#155188}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.5; cursor:not-allowed}

select,input[type=text]{
  border:1px solid var(--line); background:var(--panel); color:var(--text);
  padding:6px 9px; border-radius:8px; font-size:13px; font-family:inherit;
}

section.bar{
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:10px 18px; background:var(--panel); border-bottom:1px solid var(--line);
  font-size:13px;
}
section.bar label{display:flex; align-items:center; gap:6px; color:var(--muted)}
section.bar .spacer{flex:1}
#q{min-width:150px}

main{display:grid; grid-template-columns:minmax(0,1fr) 400px; gap:14px; padding:14px 18px}
@media (max-width:1040px){ main{grid-template-columns:1fr} }

.card{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
.card > h2{
  margin:0; padding:10px 14px; font-size:13px; font-weight:500;
  border-bottom:1px solid var(--line2); color:var(--muted);
  display:flex; align-items:center; gap:8px;
}
.card > h2 .spacer{flex:1}

.list{max-height:62vh; overflow:auto}
table{width:100%; border-collapse:collapse; font-size:13px}
th,td{padding:7px 10px; text-align:left; white-space:nowrap; border-bottom:1px solid var(--line2)}
th{
  position:sticky; top:0; z-index:1; background:var(--panel);
  color:var(--muted); font-weight:400; font-size:12px; border-bottom:1px solid var(--line);
}
tbody tr{cursor:pointer}
tbody tr:hover{background:#FAFBFC}
tbody tr.focus{background:var(--accent-bg)}
tbody tr.off{opacity:.42}
td.code{font-weight:500}
td.num{font-variant-numeric:tabular-nums; color:var(--muted)}

.chip{
  display:inline-block; min-width:34px; padding:1px 7px; border-radius:6px;
  background:var(--line2); color:var(--muted); text-align:center; font-size:12px;
}
.chip.have{background:var(--ok-bg); color:var(--ok)}
.chip.full{background:#FDF3E3; color:var(--warn)}
.chip.none{background:var(--line2); color:var(--dim)}
.chip .up{color:var(--alert); font-weight:500}
.chip .dn{color:var(--muted)}

.tick{width:15px;height:15px;accent-color:var(--accent); cursor:pointer}
.pill{
  font-size:11px; padding:1px 6px; border-radius:5px;
  background:var(--accent-bg); color:var(--accent); margin-left:6px;
}
.pill.fresh{background:#FCEBEB; color:var(--alert)}

svg#plot{display:block; width:100%; height:auto; background:var(--panel)}
.legend{padding:8px 14px 12px; color:var(--muted); font-size:12px; min-height:20px}
.legend .k{display:inline-flex; align-items:center; gap:5px; margin-right:14px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
.legend i.dash{height:0;border-top:2px dashed var(--dim)}

.changes{padding:0 14px 14px; font-size:12px; color:var(--muted); max-height:170px; overflow:auto}
.changes div{padding:3px 0; border-top:1px solid var(--line2)}
.changes b{color:var(--text); font-weight:500}

section.out{margin:0 18px 20px; }
pre#snippet{
  margin:0; padding:14px; background:#1F2329; color:#E6E6E6;
  border-radius:0 0 var(--r) var(--r); font:12px/1.7 ui-monospace,Consolas,monospace;
  overflow:auto; max-height:240px; white-space:pre;
}
.empty{padding:34px 18px; text-align:center; color:var(--muted); font-size:13px; line-height:1.9}
.empty code{background:var(--line2); padding:1px 6px; border-radius:5px; font-size:12px}

.toast{
  position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(14px);
  background:#1F2329; color:#fff; padding:9px 18px; border-radius:8px; font-size:13px;
  opacity:0; pointer-events:none; transition:opacity .18s, transform .18s;
}
.toast.on{opacity:1; transform:translateX(-50%) translateY(0)}
footer{padding:0 18px 26px; color:var(--dim); font-size:12px}
footer b{color:var(--muted); font-weight:500}
.hint{color:var(--dim); font-size:12px}
</style>
</head>
<body>
<h2 class="sr-only">ticket-radar 本地看板：查看余票历史曲线并生成监控配置</h2>

<header class="top">
  <div class="brand"><span class="dot" id="dot"></span>ticket-radar 看板</div>
  <div class="meta" id="meta">正在读取…</div>
  <div class="actions">
    <select id="task" title="选择监控任务"></select>
    <button class="btn primary" id="scan">立即扫描</button>
  </div>
</header>

<section class="bar">
  <label>席别 <select id="seat"></select></label>
  <label><input type="checkbox" id="onlyAvail"> 只看有票</label>
  <label><input type="checkbox" id="onlyWatched"> 只看监控范围内</label>
  <input type="text" id="q" placeholder="筛选车次 / 站名">
  <span class="hint" id="count"></span>
  <span class="spacer"></span>
  <button class="btn ghost" id="clear">清除勾选</button>
</section>

<main>
  <section class="card">
    <h2>车次列表 <span class="spacer"></span><span class="hint">点行看曲线，勾选框选进配置</span></h2>
    <div class="list"><table>
      <thead><tr id="head"></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
  </section>

  <aside class="card">
    <h2><span id="chartTitle">余票曲线</span><span class="spacer"></span><span class="hint" id="chartSub"></span></h2>
    <svg id="plot" viewBox="0 0 640 260" role="img" aria-label="余票历史曲线"></svg>
    <div class="legend" id="legend"></div>
    <div class="changes" id="changes"></div>
  </aside>
</main>

<section class="out card">
  <h2>生成的配置片段 <span class="spacer"></span>
    <button class="btn ghost" id="copy">复制</button>
    <span class="hint">粘到 tasks.yaml 对应任务的 watch 下面</span>
  </h2>
  <pre id="snippet">勾选左侧车次后，这里会出现可以直接粘进 tasks.yaml 的片段。</pre>
</section>

<footer>
  <b>看板是只读的。</b>打开页面不会向任何平台发请求；唯一会发请求的是你点「立即扫描」。
  曲线按快照绘制，两点之间保持上一次抓取的值——余票不会自己在两次抓取之间变化。
</footer>

<div class="toast" id="toast"></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);

const state = {
  status: null,
  taskId: null,
  series: null,
  scan: null,
  seat: null,
  picked: new Set(),
  focus: null,
  busy: false,
};

async function api(path, opts) {
  const res = await fetch(path, opts);
  const data = await res.json().catch(() => ({ error: "返回内容不是 JSON" }));
  if (!res.ok || data.error) throw new Error(data.error || ("HTTP " + res.status));
  return data;
}

function toast(msg, ms) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove("on"), ms || 2200);
}

function localTime(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  if (isNaN(d)) return "—";
  const p = (n) => String(n).padStart(2, "0");
  return p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
}

function seatText(v) {
  if (v === null || v === undefined) return "有";
  return String(v);
}

/* 把「历史曲线」和「实时扫描」合成一个视图模型：实时值优先，历史点保留。 */
function viewTrains() {
  const out = [];
  const series = state.series ? state.series.trains : [];
  for (const b of series) {
    const live = state.scan ? state.scan.trains.find((x) => x.train_code === b.train_code) : null;
    const seats = {};
    for (const name of Object.keys(b.seats)) {
      const pts = b.seats[name];
      const last = pts.length ? pts[pts.length - 1] : null;
      seats[name] = { v: last ? last.v : null, raw: last ? last.raw : "", price: last ? last.price : null, pts };
    }
    if (live) {
      for (const name of Object.keys(live.seats)) {
        const s = live.seats[name];
        const base = seats[name] || { pts: [] };
        seats[name] = {
          v: s.available ? s.count : 0,
          raw: s.raw,
          price: s.price,
          pts: base.pts,
        };
      }
    }
    out.push({
      train_code: b.train_code,
      from: b.from, to: b.to, depart: b.depart, arrive: b.arrive, duration: b.duration,
      watched: live ? live.watched : b.watched,
      matched: live ? live.matched : null,
      seats: seats,
      fresh: !!(live && live.matched),
    });
  }
  /* 实时扫描里冒出、历史里没有的车次（临时加开）也要显示 */
  for (const s of (state.scan ? state.scan.trains : [])) {
    if (out.some((x) => x.train_code === s.train_code)) continue;
    const seats = {};
    for (const name of Object.keys(s.seats)) {
      const x = s.seats[name];
      seats[name] = { v: x.available ? x.count : 0, raw: x.raw, price: x.price, pts: [] };
    }
    out.push({
      train_code: s.train_code, from: s.from, to: s.to, depart: s.depart, arrive: s.arrive,
      duration: s.duration, watched: s.watched, matched: s.matched, seats: seats, fresh: !!s.matched,
    });
  }
  out.sort((a, b) => (a.depart || "99:99").localeCompare(b.depart || "99:99") || a.train_code.localeCompare(b.train_code));
  return out;
}

function seatNames(trains) {
  const seen = new Map();
  for (const t of trains) {
    for (const n of Object.keys(t.seats)) seen.set(n, (seen.get(n) || 0) + 1);
  }
  return [...seen.entries()].sort((a, b) => b[1] - a[1]).map((e) => e[0]);
}

/* 最近一次变化：值变过才算，用来给「刚放票」加红标。 */
function lastDelta(pts) {
  if (!pts || pts.length < 2) return null;
  const now = pts[pts.length - 1], prev = pts[pts.length - 2];
  if (now.v === prev.v) return null;
  return { from: prev.v, to: now.v, t: now.t };
}

function renderHead(names) {
  const cols = ["", "车次", "出发", "到达", "历时", ...names, "状态"];
  $("head").innerHTML = cols.map((c) => "<th>" + c + "</th>").join("");
}

function renderRows() {
  const trains = viewTrains();
  const names = seatNames(trains);
  renderHead(names);

  const q = $("q").value.trim().toLowerCase();
  const onlyAvail = $("onlyAvail").checked;
  const onlyWatched = $("onlyWatched").checked;
  const seat = state.seat;

  let shown = 0;
  const html = [];
  for (const t of trains) {
    if (onlyWatched && !t.watched) continue;
    const cur = t.seats[seat];
    if (onlyAvail && !(cur && cur.v !== 0)) continue;
    if (q) {
      const hay = (t.train_code + " " + t.from + " " + t.to).toLowerCase();
      if (!hay.includes(q)) continue;
    }
    shown++;

    const cells = names.map((name) => {
      const s = t.seats[name];
      if (!s) return '<td><span class="chip none">—</span></td>';
      const d = lastDelta(s.pts);
      let cls = "chip none", body = "无";
      if (s.v === null) { cls = "chip have"; body = "有"; }
      else if (s.v === 0) { cls = "chip none"; body = "无"; }
      else if (s.v < 10) { cls = "chip full"; body = s.v; }
      else { cls = "chip have"; body = s.v; }
      let arrow = "";
      if (d) {
        const up = (d.to === null ? 1e9 : d.to) > (d.from === null ? 1e9 : d.from);
        arrow = up ? ' <span class="up">↑</span>' : ' <span class="dn">↓</span>';
      }
      const price = s.price ? '<span class="hint"> ¥' + s.price + "</span>" : "";
      return "<td><span class='" + cls + "'>" + body + "</span>" + arrow + price + "</td>";
    }).join("");

    const status = t.fresh
      ? '<span class="pill fresh">有票</span>'
      : (t.watched ? '<span class="hint">监控中</span>' : '<span class="hint">范围外</span>');

    const focusCls = state.focus === t.train_code ? "focus" : "";
    const offCls = t.watched ? "" : "off";
    const checked = state.picked.has(t.train_code) ? " checked" : "";
    html.push(
      "<tr class='" + focusCls + " " + offCls + "' data-code='" + t.train_code + "'>" +
      "<td><input type='checkbox' class='tick' data-tick='" + t.train_code + "'" + checked + "></td>" +
      "<td class='code'>" + t.train_code + "</td>" +
      "<td class='num'>" + (t.depart || "—") + "</td>" +
      "<td class='num'>" + (t.arrive || "—") + "</td>" +
      "<td class='num'>" + (t.duration || "—") + "</td>" +
      cells +
      "<td>" + status + "</td>" +
      "</tr>"
    );
  }

  $("rows").innerHTML = html.join("") ||
    "<tr><td colspan='99' class='empty'>没有符合筛选条件的车次。</td></tr>";
  $("count").textContent = "显示 " + shown + " / 共 " + trains.length + " 趟";
}

function xOf(v, lo, hi, left, wid) { return left + ((v - lo) / (hi - lo)) * wid; }

function drawChart() {
  const svg = $("plot");
  const trains = viewTrains();
  const t = trains.find((x) => x.train_code === state.focus);
  const title = $("chartTitle"), sub = $("chartSub"), legend = $("legend"), changes = $("changes");

  if (!t || !state.series) {
    svg.innerHTML = '<text x="320" y="132" text-anchor="middle" fill="#9CA3AF" font-size="13">点左侧任意一行，看它的余票曲线</text>';
    title.textContent = "余票曲线";
    sub.textContent = "";
    legend.innerHTML = "";
    changes.innerHTML = "";
    return;
  }

  const seat = state.seat;
  const pts = (t.seats[seat] && t.seats[seat].pts) || [];
  title.textContent = t.train_code + "　" + (seat || "");
  sub.textContent = (t.from || "") + " → " + (t.to || "");

  if (!pts.length) {
    svg.innerHTML = '<text x="320" y="132" text-anchor="middle" fill="#9CA3AF" font-size="13">这个席别还没有历史采样，先跑几轮监控</text>';
    legend.innerHTML = "";
    changes.innerHTML = "";
    return;
  }

  const L = 48, R = 628, T = 18, B = 226;
  let lo = new Date(state.series.from || pts[0].t).getTime();
  let hi = new Date(state.series.to || pts[pts.length - 1].t).getTime();
  if (!(hi > lo)) hi = lo + 3600 * 1000;
  const wid = R - L, hei = B - T;

  const known = pts.map((p) => p.v).filter((v) => v !== null);
  const maxKnown = Math.max(1, ...known);
  const noneLevel = maxKnown * 1.18;
  const vTop = maxKnown * 1.38;
  const yOf = (v) => B - ((v === null ? noneLevel : v) / vTop) * hei;

  const out = [];
  /* 水平网格 + 纵轴刻度 */
  const ticks = [0, Math.round(maxKnown / 2), maxKnown];
  for (const v of ticks) {
    const y = yOf(v).toFixed(1);
    out.push('<line x1="' + L + '" y1="' + y + '" x2="' + R + '" y2="' + y + '" stroke="#F0F1F3" stroke-width="1"/>');
    out.push('<text x="' + (L - 8) + '" y="' + y + '" text-anchor="end" dominant-baseline="central" fill="#9CA3AF" font-size="11">' + v + "</text>");
  }
  /* 「有票但数量未知」的天花板：12306 返回「有」时落在这里 */
  const yNone = yOf(null);
  out.push('<line x1="' + L + '" y1="' + yNone.toFixed(1) + '" x2="' + R + '" y2="' + yNone.toFixed(1) + '" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>');
  out.push('<text x="' + (L - 8) + '" y="' + yNone.toFixed(1) + '" text-anchor="end" dominant-baseline="central" fill="#9CA3AF" font-size="11">有票</text>');

  /* 阶梯路径：余票在两次抓取之间不会变，画斜线等于伪造中间过程 */
  let d = "M " + xOf(new Date(pts[0].t).getTime(), lo, hi, L, wid).toFixed(1) + " " + yOf(pts[0].v).toFixed(1);
  for (let i = 1; i < pts.length; i++) {
    const x = xOf(new Date(pts[i].t).getTime(), lo, hi, L, wid).toFixed(1);
    d += " H " + x + " V " + yOf(pts[i].v).toFixed(1);
  }
  d += " H " + R;
  out.push('<path d="' + d + '" fill="none" stroke="#185FA5" stroke-width="2" stroke-linejoin="round"/>');

  /* 只在「值真的变了」的地方画点，避免满屏圆点看不出变化 */
  for (const p of pts) {
    const x = xOf(new Date(p.t).getTime(), lo, hi, L, wid).toFixed(1);
    const up = p.v !== 0;
    out.push('<circle cx="' + x + '" cy="' + yOf(p.v).toFixed(1) + '" r="3.2" fill="' + (up ? "#0F6E56" : "#FFFFFF") + '" stroke="' + (up ? "#0F6E56" : "#9CA3AF") + '" stroke-width="1.5"/>');
  }

  /* 横轴：只标首尾，中间挤不下反而难读 */
  out.push('<text x="' + L + '" y="' + (B + 18) + '" text-anchor="start" fill="#9CA3AF" font-size="11">' + localTime(pts[0].t) + "</text>");
  out.push('<text x="' + R + '" y="' + (B + 18) + '" text-anchor="end" fill="#9CA3AF" font-size="11">' + localTime(pts[pts.length - 1].t) + "</text>");

  svg.innerHTML = out.join("");
  legend.innerHTML =
    '<span class="k"><i style="background:#185FA5"></i>余票张数</span>' +
    '<span class="k"><i class="dash"></i>有票（数量未知）</span>' +
    '<span class="k">采样 ' + state.series.points + " 次，变化 " + (pts.length - 1) + " 次</span>";

  const rows = pts.map((p, i) => {
    const prev = i ? pts[i - 1].v : null;
    const arrow = i ? (p.v === null ? "↑有票" : (String(p.v) > String(prev) ? "↑" + p.v : "↓" + p.v)) : "初始";
    return "<div><b>" + localTime(p.t) + "</b>　" + arrow + "　" + (p.price ? "¥" + p.price : "") + "</div>";
  }).reverse().slice(0, 40);
  changes.innerHTML = rows.join("");
}

async function makeSnippet() {
  const box = $("snippet");
  if (!state.picked.size) {
    box.textContent = "勾选左侧车次后，这里会出现可以直接粘进 tasks.yaml 的片段。";
    return;
  }
  try {
    const r = await api("/api/snippet", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ task_id: state.taskId, train_codes: [...state.picked] }),
    });
    box.textContent = r.snippet || "（没有可生成的内容）";
  } catch (e) {
    box.textContent = "生成失败：" + e.message;
  }
}

async function loadSeries(taskId) {
  const data = await api("/api/series?task_id=" + encodeURIComponent(taskId));
  state.series = data;
  const names = seatNames(viewTrains());
  const prev = state.seat;
  if (!names.includes(prev)) {
    const want = (state.status && state.status.tasks.find((x) => x.id === taskId) || {}).seat_types || [];
    state.seat = names.find((n) => want.includes(n)) || names[0] || null;
  }
  const sel = $("seat");
  sel.innerHTML = names.map((n) => "<option" + (n === state.seat ? " selected" : "") + ">" + n + "</option>").join("");
  if (!state.focus && state.series.trains.length) state.focus = state.series.trains[0].train_code;
  $("dot").style.background = state.series.points ? "#0F6E56" : "#B4B2A9";
  renderRows();
  drawChart();
}

async function loadStatus() {
  const st = await api("/api/status");
  state.status = st;
  $("meta").innerHTML =
    "配置 <b>" + st.config_path + "</b>　·　库 <b>" + st.db_path + "</b>　·　" +
    "快照 <b>" + st.counts.snapshots + "</b> 条　变更 <b>" + st.counts.changes + "</b> 条";
  const sel = $("task");
  sel.innerHTML = st.tasks.map((t) =>
    "<option value='" + t.id + "'>" + t.name + (t.enabled ? "" : "（已停用）") + "</option>").join("");
  if (!sel.options.length) {
    $("rows").innerHTML = "<tr><td class='empty'>配置里没有任务。先运行 <code>radar init</code> 生成示例配置。</td></tr>";
    return false;
  }
  state.taskId = sel.value;
  return true;
}

async function boot() {
  try {
    if (!(await loadStatus())) return;
    await loadSeries(state.taskId);
  } catch (e) {
    $("meta").textContent = "读取失败：" + e.message;
  }
}

$("task").addEventListener("change", async (e) => {
  state.taskId = e.target.value;
  state.scan = null;
  state.focus = null;
  state.picked.clear();
  await makeSnippet();
  await loadSeries(state.taskId).catch((err) => toast("加载失败：" + err.message));
  $("scan").disabled = false;
});

$("seat").addEventListener("change", (e) => {
  state.seat = e.target.value;
  renderRows();
  drawChart();
});

for (const id of ["onlyAvail", "onlyWatched"]) $(id).addEventListener("change", renderRows);
$("q").addEventListener("input", renderRows);

$("rows").addEventListener("click", (e) => {
  const tick = e.target.closest("input[data-tick]");
  if (tick) {
    const code = tick.getAttribute("data-tick");
    if (tick.checked) state.picked.add(code); else state.picked.delete(code);
    makeSnippet();
    return;
  }
  const tr = e.target.closest("tr[data-code]");
  if (!tr) return;
  state.focus = tr.getAttribute("data-code");
  renderRows();
  drawChart();
});

$("clear").addEventListener("click", async () => {
  state.picked.clear();
  renderRows();
  await makeSnippet();
  toast("已清除勾选");
});

$("copy").addEventListener("click", async () => {
  const text = $("snippet").textContent;
  if (!text || text.startsWith("勾选")) { toast("还没有可复制的内容"); return; }
  try {
    await navigator.clipboard.writeText(text);
    toast("已复制");
  } catch (e) {
    const r = document.createRange();
    r.selectNodeContents($("snippet"));
    const s = getSelection();
    s.removeAllRanges();
    s.addRange(r);
    toast("已选中，按 Ctrl+C 复制");
  }
});

$("scan").addEventListener("click", async () => {
  if (state.busy) return;
  state.busy = true;
  const btn = $("scan");
  btn.disabled = true;
  btn.textContent = "扫描中…";
  try {
    state.scan = await api("/api/scan?task_id=" + encodeURIComponent(state.taskId));
    const n = state.scan.trains.filter((t) => t.matched).length;
    toast("扫描完成：范围内 " + state.scan.watched_count + " 趟，现在有票 " + n + " 趟");
    renderRows();
    drawChart();
  } catch (e) {
    toast("扫描失败：" + e.message, 4200);
  } finally {
    state.busy = false;
    btn.disabled = false;
    btn.textContent = "立即扫描";
  }
});

boot();
</script>
</body>
</html>
